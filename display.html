<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>さくらの全国リスナーMAP</title><style>
:root{--pink:#f7c8d8;--deep:#d96591;--ink:#59424a;--paper:rgba(255,250,252,.94)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
body.overlay{background:transparent;padding:18px}
.card{background:var(--paper);border:3px solid #fff;border-radius:28px;box-shadow:0 10px 35px rgba(120,70,90,.18);padding:20px}
h1{margin:0;text-align:center;font-size:30px}.sub{text-align:center;margin:6px 0 14px;color:#8c6a76}
.stats{display:flex;gap:12px;justify-content:center;margin-bottom:15px}.stat{background:#fff;border:2px solid #f6d8e3;border-radius:18px;padding:8px 16px;text-align:center}.stat b{font-size:24px;color:var(--deep)}
.map{display:grid;grid-template-columns:repeat(11,68px);grid-template-rows:repeat(15,50px);gap:4px;justify-content:center;align-items:center}
.pref{width:68px;height:50px;border-radius:12px;background:#f3f0f1;border:1px solid #e5dfe1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;transition:.25s;position:relative}
.pref b{font-size:16px}.pref.on{background:#fce4ed;border-color:#efb6ca}.pref.hot{background:#f5bdd2}.pref.veryhot{background:#eb8fb2;color:#fff}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:white;border:4px solid var(--pink);border-radius:30px;padding:24px 38px;font-size:28px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 50px rgba(0,0,0,.18)}
.flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style></head>

<div class="pref" data-pref="沖縄県" style="grid-row:15;grid-column:1"><span>沖縄</span><b>0</b></div></div></div><div id="flash" class="flash"></div>
<script>
const KEY='sakuraListenerMapV1';
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function render(){
 const d=data(); let total=0,covered=0;
 document.querySelectorAll('.pref').forEach(el=>{
  let n=Number(d[el.dataset.pref]||0); total+=n;if(n>0)covered++;
  el.querySelector('b').textContent=n;
  el.classList.toggle('on',n>0);el.classList.toggle('hot',n>=5);el.classList.toggle('veryhot',n>=10);
 });
 totalEl=document.getElementById('total');coveredEl=document.getElementById('covered');
 totalEl.textContent=total;coveredEl.textContent=covered;
}
window.addEventListener('storage',e=>{if(e.key===KEY){render(); if(e.newValue){let x=JSON.parse(e.newValue);if(x._last)showFlash(x._last)}}});
function showFlash(x){const f=document.getElementById('flash');f.textContent=`🌸 ${x.pref} ${x.count}人目！`;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),2200)}
render();setInterval(render,1000);
</script></body></html>
