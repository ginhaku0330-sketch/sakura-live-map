<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>さくらの全国リスナーMAP</title><style>
:root{--pink:#d86f95;--deep:#a84f70;--paper:rgba(255,250,252,.94)}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#754858}
body{display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:min(100%,920px);height:min(100%,920px);background:var(--paper);border:3px solid #fff;border-radius:32px;box-shadow:0 12px 40px #8b52642a;padding:18px;display:flex;flex-direction:column}
h1{text-align:center;margin:0;color:#a95070;font-size:clamp(24px,4vw,42px)} .sub{text-align:center;font-size:14px;margin:3px 0 8px}
.stats{display:flex;justify-content:center;gap:12px;margin-bottom:5px} .stat{background:#fff;border:2px solid #f2c8d6;border-radius:16px;padding:7px 18px;text-align:center;font-size:13px} .stat b{font-size:25px;color:#c45d82}
#map{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#map svg{width:100%;height:100%;max-height:720px;filter:drop-shadow(0 6px 10px #a85d7622)}
#map [data-name]{stroke:#fff;stroke-width:1.6;transition:.25s}
.note{text-align:center;font-size:11px;color:#aa8290;margin-top:3px}
</style></head><body><div class="card">
<h1>🌸 さくらの全国リスナーMAP 🌸</h1><div class="sub">あなたの都道府県、何人いる？</div>
<div class="stats"><div class="stat">制覇<br><b id="covered">—/47</b></div><div class="stat">全国のお客さま<br><b id="total">—人</b></div><div class="stat">🌹 薔薇<br><b id="roses">—本</b></div></div>
<div id="map"><div>日本地図を読み込み中…🗾</div></div>
<div id="connection" class="note" role="status">接続中…</div><div class="note">来てくれた県ほど桜色が濃くなるよ🌸</div></div>
<script type="module" src="display.js?v=rose1"></script></body></html>
