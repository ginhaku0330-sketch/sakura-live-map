<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>さくらの全国リスナーMAP</title><style>
:root{--pink:#d86f95;--deep:#a84f70;--paper:rgba(255,250,252,.94)}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#754858}
body{display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:min(100%,920px);height:min(100%,920px);background:var(--paper);border:3px solid #fff;border-radius:32px;box-shadow:0 12px 40px #8b52642a;padding:18px;display:flex;flex-direction:column}
h1{text-align:center;margin:0;color:#a95070;font-size:clamp(24px,4vw,42px)} .sub{text-align:center;font-size:14px;margin:3px 0 8px}
.stats{display:flex;justify-content:center;gap:12px;margin-bottom:5px} .stat{background:#fff;border:2px solid #f2c8d6;border-radius:16px;padding:7px 18px;text-align:center;font-size:13px} .stat b{font-size:25px;color:#c45d82}
#map{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#map svg{width:100%;height:100%;max-height:720px;filter:drop-shadow(0 6px 10px #a85d7622)}
#map [data-name]{stroke:#fff;stroke-width:1.6;transition:.25s}
.note{text-align:center;font-size:11px;color:#aa8290;margin-top:3px}
</style></head><body><div class="card">
<h1>🌸 さくらの全国リスナーMAP 🌸</h1><div class="sub">あなたの都道府県、何人いる？</div>
<div class="stats"><div class="stat">制覇<br><b id="covered">0/47</b></div><div class="stat">全国のお客さま<br><b id="total">0人</b></div></div>
<div id="map"><div>日本地図を読み込み中…🗾</div></div>
<div class="note">来てくれた県ほど桜色が濃くなるよ🌸</div></div>
<script>const PREFS=["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"];
const ALIASES={"北海道": ["ほっかいどう"], "青森県": ["あおもり", "あおもりけん"], "岩手県": ["いわて", "いわてけん"], "宮城県": ["みやぎ", "みやぎけん"], "秋田県": ["あきた", "あきたけん"], "山形県": ["やまがた", "やまがたけん"], "福島県": ["ふくしま", "ふくしまけん"], "茨城県": ["いばらき", "いばらきけん"], "栃木県": ["とちぎ", "とちぎけん"], "群馬県": ["ぐんま", "ぐんまけん"], "埼玉県": ["さいたま", "さいたまけん"], "千葉県": ["ちば", "ちばけん"], "東京都": ["とうきょう", "とうきょうと"], "神奈川県": ["かながわ", "かながわけん"], "新潟県": ["にいがた", "にいがたけん"], "富山県": ["とやま", "とやまけん"], "石川県": ["いしかわ", "いしかわけん"], "福井県": ["ふくい", "ふくいけん"], "山梨県": ["やまなし", "やまなしけん"], "長野県": ["ながの", "ながのけん"], "岐阜県": ["ぎふ", "ぎふけん"], "静岡県": ["しずおか", "しずおかけん"], "愛知県": ["あいち", "あいちけん"], "三重県": ["みえ", "みえけん"], "滋賀県": ["しが", "しがけん"], "京都府": ["きょうと", "きょうとふ"], "大阪府": ["おおさか", "おおさかふ"], "兵庫県": ["ひょうご", "ひょうごけん"], "奈良県": ["なら", "ならけん"], "和歌山県": ["わかやま", "わかやまけん"], "鳥取県": ["とっとり", "とっとりけん"], "島根県": ["しまね", "しまねけん"], "岡山県": ["おかやま", "おかやまけん"], "広島県": ["ひろしま", "ひろしまけん"], "山口県": ["やまぐち", "やまぐちけん"], "徳島県": ["とくしま", "とくしまけん"], "香川県": ["かがわ", "かがわけん"], "愛媛県": ["えひめ", "えひめけん"], "高知県": ["こうち", "こうちけん"], "福岡県": ["ふくおか", "ふくおかけん"], "佐賀県": ["さが", "さがけん"], "長崎県": ["ながさき", "ながさきけん"], "熊本県": ["くまもと", "くまもとけん"], "大分県": ["おおいた", "おおいたけん"], "宮崎県": ["みやざき", "みやざきけん"], "鹿児島県": ["かごしま", "かごしまけん"], "沖縄県": ["おきなわ", "おきなわけん"]};
const KEY='sakuraListenerMapV3';
function getData(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function setData(d){localStorage.setItem(KEY,JSON.stringify(d)); window.dispatchEvent(new Event('storage-local'))}
function total(d){return Object.values(d).reduce((a,b)=>a+(+b||0),0)}
function covered(d){return PREFS.filter(p=>(+d[p]||0)>0).length}

const MAP_URL='https://cdn.jsdelivr.net/gh/lalamalink/japan-map-svg@main/svg/deformed-japan-prefecture-map.svg';
let ready=false;
function colorFor(n){if(n<=0)return '#f7edf1'; if(n===1)return '#f7bfd1'; if(n===2)return '#ef95b4'; if(n===3)return '#e5719b'; if(n<=5)return '#d65383'; return '#b83f6d'}
function paint(){
 let d=getData(); coveredEl.textContent=covered(d)+'/47'; totalEl.textContent=total(d)+'人';
 if(!ready)return;
 PREFS.forEach(p=>{
   let el=document.querySelector(`#map [data-name="${p}"]`);
   if(el){el.style.fill=colorFor(+d[p]||0); el.style.stroke='#fff';}
 });
}
const coveredEl=document.getElementById('covered'), totalEl=document.getElementById('total');
fetch(MAP_URL).then(r=>r.text()).then(svg=>{
 document.getElementById('map').innerHTML=svg; ready=true; paint();
}).catch(()=>{document.getElementById('map').innerHTML='<b>地図を読み込めませんでした🥺<br>ネット接続を確認してね</b>'});
window.addEventListener('storage',paint); window.addEventListener('storage-local',paint); setInterval(paint,1000); paint();
</script></body></html>
